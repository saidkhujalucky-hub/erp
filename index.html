<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Plast ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf1f8;--card:#fff;--ink:#0e2036;--mut:#5a6b80;--line:#d3dde9;--ac:#1456c8;--acs:#e3edfc;--ok:#13795b;--oks:#dff3ec;--warn:#9a5a06;--warns:#fdf0d9;--bad:#b42318;--bads:#fde6e3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1524;--card:#12233a;--ink:#e6eef8;--mut:#93a5bb;--line:#243a57;--ac:#6ea4ff;--acs:#173254;--ok:#5fd3ae;--oks:#123a30;--warn:#f0b35a;--warns:#3b2c10;--bad:#ff8a7d;--bads:#40181a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1524;--card:#12233a;--ink:#e6eef8;--mut:#93a5bb;--line:#243a57;--ac:#6ea4ff;--acs:#173254;--ok:#5fd3ae;--oks:#123a30;--warn:#f0b35a;--warns:#3b2c10;--bad:#ff8a7d;--bads:#40181a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
nav{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
nav button[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:7px;font:inherit;font-weight:500;cursor:pointer}
.btn.alt{background:var(--acs);color:var(--ac)}.btn.bad{background:var(--bads);color:var(--bad)}.btn.ok{background:var(--ok);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.order{border-left:5px solid var(--ac)}
.order.approval{border-left-color:var(--warn)}.order.rejected{border-left-color:var(--bad)}.order.closed{border-left-color:var(--ok)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.badge{font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:500}
.badge.warn{background:var(--warns);color:var(--warn)}.badge.bad{background:var(--bads);color:var(--bad)}.badge.ok{background:var(--oks);color:var(--ok)}
.steps{display:flex;gap:4px;margin:10px 0}
.steps span{flex:1;text-align:center;font-size:12px;padding:5px 2px;border-radius:5px;background:var(--bg);color:var(--mut)}
.steps span.done{background:var(--oks);color:var(--ok)}.steps span.cur{background:var(--ac);color:#fff}
.money{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0;color:var(--mut)}
.money b{color:var(--ink);font-weight:700}
.note{padding:7px 10px;border-radius:7px;margin:6px 0;font-size:14px}
.note.warn{background:var(--warns);color:var(--warn)}.note.bad{background:var(--bads);color:var(--bad)}.note.ok{background:var(--oks);color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:8px}
.row .f{width:150px}
.kpis{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:20px}
.kpi span{color:var(--mut);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--acs);min-width:4px}
.empty{color:var(--mut);padding:18px;text-align:center}
@media (prefers-reduced-motion:no-preference){.btn{transition:filter .15s}.btn:hover{filter:brightness(1.1)}}
</style>
</head>
<body>
<div class="wrap">
<h1>Easy Plast — управление заказами</h1>
<p class="sub">Заказ → проверка кредита и маржи → производство → предоплата 30% → отгрузка → оплата 70% через 30 дней</p>
<nav id="nav"></nav>
<div id="app"></div>
<input id="imp" type="file" accept="application/json" hidden>
</div>
<script>
var KEY="easyplast_erp_v1",MIN_MARGIN=15,STEPS=["Закупка сырья","Экструзия","Печать","Резка"];
var S=load();
function seed(){var t=today();return{tab:"orders",printAfterPrepay:true,nid:3,
clients:[{id:1,name:"Aqua Pure (вода 19 л)",limit:60000000},{id:2,name:"Sweet Cookies",limit:20000000}],
orders:[{id:1,cid:1,product:"Пакет для бутыли 19 л, синий",qty:2000,price:21000,cost:15500,status:"prod",step:1,reasons:[],pay:[{d:t,sum:12600000}],ship:null},
{id:2,cid:2,product:"Пакет с печатью, 30×40",qty:1500,price:24000,cost:22800,status:"approval",step:0,reasons:["маржа 5% ниже порога 15%"],pay:[],ship:null}]}}
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){var x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function fmt(n){return Math.round(n).toLocaleString("ru-RU")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function total(o){return o.qty*o.price}
function paid(o){return o.pay.reduce(function(a,p){return a+p.sum},0)}
function dueDate(o){return o.ship?addDays(o.ship,30):null}
function isLate(o){return o.status==="shipped"&&dueDate(o)<today()&&paid(o)<total(o)}
function client(id){return S.clients.find(function(c){return c.id===id})||{name:"—",limit:0}}
function open(o){return o.status!=="closed"&&o.status!=="rejected"}
function exposure(cid,skip){return S.orders.filter(function(o){return o.cid===cid&&open(o)&&o.id!==skip}).reduce(function(a,o){return a+total(o)-paid(o)},0)}
function hasLate(cid){return S.orders.some(function(o){return o.cid===cid&&isLate(o)})}
function check(o){var r=[],m=(o.price-o.cost)/o.price*100,c=client(o.cid);
if(m<MIN_MARGIN)r.push("маржа "+m.toFixed(0)+"% ниже порога "+MIN_MARGIN+"%");
if(hasLate(o.cid))r.push("у клиента есть просроченный долг");
var ex=exposure(o.cid,o.id)+total(o);if(ex>c.limit)r.push("кредитный лимит превышен: "+fmt(ex)+" из "+fmt(c.limit)+" сум");return r}
function $(id){return document.getElementById(id)}
function val(id){return $(id).value}
var ACT={
addClient:function(){var n=val("cn").trim(),l=+val("cl");if(!n||!(l>=0)){return}S.clients.push({id:S.nid++,name:n,limit:l});go()},
addOrder:function(){var o={id:S.nid++,cid:+val("oc"),product:val("op").trim(),qty:+val("oq"),price:+val("opr"),cost:+val("ocs"),status:"prod",step:0,reasons:[],pay:[],ship:null};
if(!o.cid||!o.product||!(o.qty>0)||!(o.price>0)||!(o.cost>=0)){$("err").textContent="Заполните клиента, товар, тираж, цену и себестоимость.";$("err").style.display="block";return}
o.reasons=check(o);o.status=o.reasons.length?"approval":"prod";S.orders.unshift(o);go()},
approve:function(id){var o=byId(id);o.status="prod";o.reasons.push("согласовано финансовым директором");go()},
reject:function(id){var o=byId(id);o.status="rejected";go()},
next:function(id){var o=byId(id);if(blocked(o))return;o.step++;if(o.step>=STEPS.length)o.status="ready";go()},
pay:function(id){var o=byId(id),v=+val("pay"+id);if(!(v>0))return;o.pay.push({d:today(),sum:v});if(o.status==="shipped"&&paid(o)>=total(o))o.status="closed";go()},
ship:function(id){var o=byId(id);if(paid(o)<total(o)*0.3)return;o.status="shipped";o.ship=today();go()},
tab:function(t){S.tab=t;go()},
toggle:function(){S.printAfterPrepay=!S.printAfterPrepay;go()},
reset:function(){S=seed();go()},
exportData:function(){var b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="easyplast-erp-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)},
importData:function(){$("imp").click()}};
function byId(id){return S.orders.find(function(o){return o.id===id})}
function blocked(o){return S.printAfterPrepay&&STEPS[o.step]==="Печать"&&paid(o)<total(o)*0.3}
function go(){save();draw()}
document.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b||b.disabled)return;var f=ACT[b.dataset.a];if(f)f(b.dataset.id?+b.dataset.id:b.dataset.t)});
var LBL={prod:"В производстве",approval:"Ждёт финдиректора",ready:"Готов к отгрузке",shipped:"Отгружен",closed:"Оплачен полностью",rejected:"Отклонён"};
function badge(o){var c=o.status==="approval"?"warn":o.status==="rejected"?"bad":(o.status==="closed"||o.status==="ready")?"ok":"";
if(isLate(o))return '<span class="badge bad">Просрочка</span>';return '<span class="badge '+c+'">'+LBL[o.status]+'</span>'}
function orderCard(o){var c=client(o.cid),t=total(o),p=paid(o),need=t*0.3,h="";
h+='<div class="panel order '+o.status+'"><div class="top"><b>№'+o.id+' · '+esc(c.name)+'</b>'+badge(o)+'</div>';
h+='<div>'+esc(o.product)+' — '+fmt(o.qty)+' кг × '+fmt(o.price)+' сум</div>';
h+='<div class="money"><span>Сумма <b>'+fmt(t)+'</b></span><span>Предоплата 30% <b>'+fmt(need)+'</b></span><span>Оплачено <b>'+fmt(p)+'</b></span><span>Остаток <b>'+fmt(t-p)+'</b></span><span>Маржа <b>'+((o.price-o.cost)/o.price*100).toFixed(0)+'%</b></span></div>';
if(o.status==="approval"){h+='<div class="note warn">Нужно согласование: '+esc(o.reasons.join("; "))+'</div><div class="row"><button class="btn ok" data-a="approve" data-id="'+o.id+'">Согласовать</button><button class="btn bad" data-a="reject" data-id="'+o.id+'">Отказать</button></div>'}
else if(o.status==="rejected"){h+='<div class="note bad">Отказ. Предложите клиенту 100% предоплату или меньший тираж.</div>'}
else{h+='<div class="steps">'+STEPS.map(function(s,i){var d=o.status!=="prod"||i<o.step;return '<span class="'+(d?"done":i===o.step?"cur":"")+'">'+s+'</span>'}).join("")+'</div>';
if(o.status==="prod"){if(blocked(o))h+='<div class="note warn">Печать на паузе: нет предоплаты 30% ('+fmt(need-p)+' сум). Макет клиента нельзя продать другому.</div>';
h+='<div class="row"><button class="btn alt" data-a="next" data-id="'+o.id+'"'+(blocked(o)?" disabled":"")+'>Завершить: '+STEPS[o.step]+'</button></div>'}
if(o.status==="ready"){var ok=p>=need;h+=ok?'<div class="note ok">Предоплата внесена — можно выписывать УПД и отгружать.</div>':'<div class="note bad">Отгрузка заморожена: не хватает '+fmt(need-p)+' сум предоплаты.</div>';
h+='<div class="row"><button class="btn" data-a="ship" data-id="'+o.id+'"'+(ok?"":" disabled")+'>Выписать УПД и отгрузить</button></div>'}
if(o.status==="shipped")h+='<div class="note '+(isLate(o)?"bad":"warn")+'">Остаток '+fmt(t-p)+' сум — оплатить до '+dueDate(o)+'</div>';
if(o.status!=="closed"){h+='<div class="row"><div class="f"><label>Оплата от клиента, сум</label><input id="pay'+o.id+'" type="number" min="0" inputmode="numeric"></div><button class="btn alt" data-a="pay" data-id="'+o.id+'">Внести оплату</button></div>'}}
return h+'</div>'}
function viewOrders(){var h='<div class="panel"><div class="grid"><div><label>Клиент</label><select id="oc">'+S.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select></div>'+
'<div><label>Товар, размер</label><input id="op" placeholder="Пакет 30×40, печать"></div><div><label>Тираж, кг</label><input id="oq" type="number" min="1"></div><div><label>Цена, сум/кг</label><input id="opr" type="number" min="1"></div><div><label>Себестоимость, сум/кг</label><input id="ocs" type="number" min="0"></div><button class="btn" data-a="addOrder">Создать заказ</button></div><div id="err" class="note bad" style="display:none"></div></div>';
h+='<div class="panel"><label style="display:flex;gap:8px;align-items:center;margin:0;color:var(--ink)"><input type="checkbox" style="width:auto" '+(S.printAfterPrepay?"checked":"")+' data-a="toggle"> Печатать только после предоплаты 30%</label></div>';
return h+(S.orders.length?S.orders.map(orderCard).join(""):'<div class="empty">Заказов пока нет. Создайте первый выше.</div>')}
function viewClients(){var h='<div class="panel"><div class="grid"><div><label>Название клиента</label><input id="cn"></div><div><label>Кредитный лимит, сум</label><input id="cl" type="number" min="0"></div><button class="btn" data-a="addClient">Добавить клиента</button></div></div>';
h+='<div class="panel tw"><table><tr><th>Клиент</th><th>Лимит</th><th>Долг и заказы в работе</th><th>Свободно</th><th>Статус</th></tr>';
S.clients.forEach(function(c){var ex=exposure(c.id),late=hasLate(c.id);h+='<tr><td>'+esc(c.name)+'</td><td>'+fmt(c.limit)+'</td><td>'+fmt(ex)+'</td><td>'+fmt(Math.max(0,c.limit-ex))+'</td><td>'+(late?'<span class="badge bad">Есть просрочка</span>':ex>c.limit?'<span class="badge warn">Лимит превышен</span>':'<span class="badge ok">В норме</span>')+'</td></tr>'});
return h+'</table></div>'}
function viewCash(){var rows=S.orders.filter(function(o){return o.status==="shipped"&&paid(o)<total(o)}).sort(function(a,b){return dueDate(a)<dueDate(b)?-1:1}),t=today();
var all=0,late=0,w=0,m=0,mx=1;rows.forEach(function(o){var r=total(o)-paid(o);all+=r;mx=Math.max(mx,r);if(dueDate(o)<t)late+=r;if(dueDate(o)<=addDays(t,7))w+=r;if(dueDate(o)<=addDays(t,30))m+=r});
var pre=S.orders.filter(function(o){return(o.status==="prod"||o.status==="ready")&&paid(o)<total(o)*0.3}).reduce(function(a,o){return a+total(o)*0.3-paid(o)},0);
var h='<div class="kpis"><div class="kpi"><b>'+fmt(all)+'</b><span>К получению, сум</span></div><div class="kpi"><b style="color:var(--bad)">'+fmt(late)+'</b><span>Просрочено</span></div><div class="kpi"><b>'+fmt(w)+'</b><span>Ожидается за 7 дней</span></div><div class="kpi"><b>'+fmt(m)+'</b><span>Ожидается за 30 дней</span></div><div class="kpi"><b>'+fmt(pre)+'</b><span>Недополучено предоплат</span></div></div>';
h+='<div class="panel tw"><table><tr><th>Срок</th><th>Клиент</th><th>Заказ</th><th>Остаток</th><th></th></tr>';
if(!rows.length)return h+'</table><div class="empty">Нет отгруженных заказов с долгом. Отгрузите готовый заказ, и здесь появится график платежей.</div></div>';
rows.forEach(function(o){var r=total(o)-paid(o);h+='<tr><td>'+dueDate(o)+(isLate(o)?' <span class="badge bad">просрочка</span>':'')+'</td><td>'+esc(client(o.cid).name)+'</td><td>№'+o.id+'</td><td>'+fmt(r)+'</td><td style="width:30%"><div class="bar" style="width:'+Math.max(4,r/mx*100)+'%"></div></td></tr>'});
return h+'</table></div>'}
function draw(){var T=[["orders","Заказы"],["clients","Клиенты и лимиты"],["cash","Деньги"]];
$("nav").innerHTML=T.map(function(t){return '<button data-a="tab" data-t="'+t[0]+'" aria-pressed="'+(S.tab===t[0])+'">'+t[1]+'</button>'}).join("")+'<button data-a="exportData" class="btn alt" style="margin-left:auto">Скачать копию</button><button data-a="importData" class="btn alt">Загрузить копию</button><button data-a="reset" class="btn bad">Сбросить демо</button>';
$("app").innerHTML=S.tab==="clients"?viewClients():S.tab==="cash"?viewCash():viewOrders();
}
$("imp").addEventListener("change",function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!Array.isArray(d.clients)||!Array.isArray(d.orders))throw 0;S=d;go()}catch(x){alert("Файл не подходит: нужна копия, скачанная из этой программы.")}};r.readAsText(f);e.target.value=""});
draw();
</script>
</body>
</html>
